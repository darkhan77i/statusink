<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20152c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Официальный вердикт</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2320152c'/%3E%3Cpath d='M32 12 38 26l14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2z' fill='%23ffb6d9'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-rounded, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; overflow: hidden; background: #20152c; color: #fff7fc; }
    .app { min-height: 100dvh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); background: radial-gradient(circle at 18% 12%, #5d306d 0, transparent 30%), radial-gradient(circle at 88% 88%, #b44578 0, transparent 33%), #20152c; }
    .orb { position: fixed; width: 280px; height: 280px; border-radius: 50%; background: #ff8ec2; filter: blur(75px); opacity: .17; animation: drift 8s ease-in-out infinite alternate; }
    .orb.one { top: -130px; right: -100px; } .orb.two { bottom: -140px; left: -90px; animation-delay: -3s; }
    .card { position: relative; width: min(100%, 410px); padding: 35px 26px 27px; border: 1px solid #ffffff22; border-radius: 32px; background: #261a33cc; box-shadow: 0 24px 70px #07030dbb; backdrop-filter: blur(16px); text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid #ffffff20; border-radius: 100px; color: #f7c8df; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
    h1 { margin: 26px 0 12px; font-size: clamp(30px, 9vw, 42px); line-height: 1.04; letter-spacing: -.05em; }
    p { margin: 0 auto 27px; max-width: 280px; color: #dfc8da; line-height: 1.55; font-size: 16px; }
    .button { width: 100%; min-height: 58px; border: 0; border-radius: 18px; background: linear-gradient(135deg, #ff9ac8, #bc6ed6); color: #271525; font: inherit; font-size: 17px; font-weight: 800; box-shadow: 0 12px 25px #e1609c40; cursor: pointer; transition: transform .18s ease, filter .18s ease; }
    .button:active { transform: scale(.97); filter: brightness(.92); }
    .hint { margin-top: 16px; margin-bottom: 0; color: #bca4b6; font-size: 12px; }
    .scan { display: none; position: absolute; inset: 0; z-index: 3; place-items: center; border-radius: 32px; background: #1b1028f2; }
    .scan.active { display: grid; }
    .scan-box { width: 150px; height: 150px; border: 2px solid #ff9ac8; border-radius: 24px; box-shadow: 0 0 35px #ff8fc277; overflow: hidden; }
    .line { width: 100%; height: 5px; background: #fff4fa; box-shadow: 0 0 20px #fff; animation: scan 1.3s ease-in-out infinite alternate; }
    .scan span { position: absolute; margin-top: 214px; color: #f4c5dc; font-weight: 700; }
    .modal { display: none; position: fixed; inset: 0; z-index: 5; place-items: center; padding: 24px; background: #11091dcc; backdrop-filter: blur(10px); }
    .modal.active { display: grid; animation: fade .24s ease both; }
    .verdict { width: min(100%, 400px); padding: 36px 24px 25px; border: 1px solid #ffffff32; border-radius: 32px; background: linear-gradient(145deg, #392042, #1d152b); box-shadow: 0 26px 80px #000b; text-align: center; }
    .seal { width: 86px; height: 86px; display: grid; place-items: center; margin: 0 auto 19px; border-radius: 50%; background: #ffafd1; color: #42203b; font-size: 43px; box-shadow: 0 0 0 10px #ffafd124, 0 0 0 20px #ffafd10e; }
    .verdict small { color: #d5adc6; letter-spacing: .13em; text-transform: uppercase; }
    .verdict h2 { margin: 13px 0 22px; font-size: clamp(32px, 10vw, 44px); letter-spacing: -.05em; line-height: 1; }
    .secondary { width: 100%; min-height: 51px; border: 1px solid #ffffff28; border-radius: 16px; background: #ffffff10; color: #fff7fc; font: inherit; font-weight: 700; cursor: pointer; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(142px); } }
    @keyframes drift { to { transform: translate(28px, 34px) scale(1.12); } }
    @keyframes fade { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="orb one"></div><div class="orb two"></div>
    <section class="card" aria-labelledby="title">
      <div class="badge">✦ секретная проверка</div>
      <h1 id="title">Узнай свой<br>официальный статус</h1>
      <p>Система проанализирует твою харизму, вайб и уровень легендарности.</p>
      <button class="button" id="start" type="button">Запустить проверку</button>
      <p class="hint">Результат готовится примерно 2 секунды</p>
      <div class="scan" id="scan" aria-live="polite"><div class="scan-box"><div class="line"></div></div><span>Анализируем данные…</span></div>
    </section>
  </main>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="result">
    <div class="verdict">
      <div class="seal">✦</div>
      <small>Официальный вердикт</small>
      <h2 id="result">Ты официально<br>Лохушка 🤭</h2>
      <button class="secondary" id="appeal" type="button">Оспорить вердикт</button>
    </div>
  </section>
  <script>
    const start = document.querySelector('#start');
    const scan = document.querySelector('#scan');
    const modal = document.querySelector('#modal');
    const appeal = document.querySelector('#appeal');
    start.addEventListener('click', () => { scan.classList.add('active'); setTimeout(() => { scan.classList.remove('active'); modal.classList.add('active'); }, 1900); });
    appeal.addEventListener('click', () => { appeal.textContent = 'Апелляция отклонена 😔'; });
  </script>
</body>
</html>
